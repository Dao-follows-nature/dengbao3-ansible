# =====================================================================
# 主机清单 - 按操作系统分组（分组仅便于管理，Playbook 通过 facts 自动识别 OS）
# 支持：OpenEuler / Anolis OS / Rocky Linux / CentOS / Ubuntu / Kylin V10（银河麒麟）
#
# 首次运行前请：
#   1. 将目标机 IP 填入对应分组（或任意分组均可，会自动识别 OS）
#   2. 确认 ansible_user 为具有 sudo 权限的普通运维用户（禁止 root，playbook 有预检）
#   3. 首次运行保持 ansible_port 注释（默认 22）；加固完成后取消注释并改为新端口
# =====================================================================
all:
  children:
    openeuler:
      hosts:
        # openeuler-01:
        #   ansible_host: 192.168.10.11
    anolis:
      hosts:
        # anolis-01:
        #   ansible_host: 192.168.10.12
    rocky:
      hosts:
        # rocky-01:
        #   ansible_host: 192.168.10.13
    centos:
      hosts:
        # centos-01:
        #   ansible_host: 192.168.10.14
    ubuntu:
      hosts:
        # ubuntu-01:
        #   ansible_host: 192.168.10.15
    kylin:
      hosts:
        # kylin-01:
        #   ansible_host: 192.168.10.16
  vars:
    # ---- 连接配置 ----
    ansible_user: opsadmin                         # 运维用户（需 sudo 权限）
    ansible_ssh_private_key_file: /root/.ssh/id_ed25519
    # ansible_ssh_pass: "ChangeMe_123"             # 密码方式（容器已内置 sshpass）
    # ansible_become_password: "ChangeMe_123"      # sudo 密码（如需）
    ansible_become: true

    # 加固完成后，把下面一行取消注释（端口与 group_vars/all.yml 中 ssh_new_port 一致）
    # ansible_port: 2222
