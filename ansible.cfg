[defaults]
inventory = inventory/hosts.yml
roles_path = roles
timeout = 30
forks = 10
interpreter_python = auto_silent
retry_files_enabled = False
deprecation_warnings = False

[ssh_connection]
pipelining = True
# accept-new: 首次连接自动记录主机指纹（等同于人工输入 yes），
# 之后指纹一旦变化立即拒绝连接，可防御中间人攻击。
# known_hosts 持久化在项目目录 .known_hosts（docker-compose 已挂载项目目录）
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/ansible/.known_hosts
